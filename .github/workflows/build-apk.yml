name: ROLEX AI Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.37

      - name: Compile and unit test
        run: |
          python -m compileall -q main.py tests
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build APK
        run: |
          rm -rf .buildozer bin
          buildozer android debug

      - name: Verify APK
        run: |
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh bin/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROLEX-AI-debug-arm64
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROLEX-AI-build-log
          path: .buildozer/**/*.log
          if-no-files-found: ignore
