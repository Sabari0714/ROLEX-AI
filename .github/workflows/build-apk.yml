name: ROLEX AI Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget zip unzip openjdk-17-jdk libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev cmake

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.37
          python -m pip install -r requirements.txt

      - name: Compile, unit test and runtime smoke test
        shell: bash
        run: |
          set -euxo pipefail
          python -m compileall -q main.py rolex_ai tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          printf 'exit\n' | ROLEX_UI=0 python main.py
          python - <<'PY'
          from rolex_ai.app import RolexAI
          app = RolexAI()
          status = app.status()
          assert status['app'] == 'ROLEX AI'
          assert status['modules']['brain'] is True
          assert status['modules']['math'] is True
          assert status['modules']['personal_intelligence'] is True
          print('ROLEX runtime smoke test: PASS')
          PY

      - name: Bootstrap Android SDK, licenses and exact Buildozer NDK
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .buildozer bin

          SDK="$GITHUB_WORKSPACE/.buildozer/android/platform/android-sdk"
          LATEST="$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/cmdline-tools"

          # Official Android command-line tools for Linux x86_64.
          curl -fL --retry 5 --retry-all-errors \
            -o /tmp/android-cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip

          rm -rf /tmp/cmdline-tools "$LATEST"
          mkdir -p /tmp/cmdline-tools
          unzip -q /tmp/android-cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$LATEST"

          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$LATEST/bin:$PATH"

          test -x "$LATEST/bin/sdkmanager"
          "$LATEST/bin/sdkmanager" --sdk_root="$SDK" --version

          yes | "$LATEST/bin/sdkmanager" --sdk_root="$SDK" --licenses >/tmp/sdk-licenses.log || true
          "$LATEST/bin/sdkmanager" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;37.0.0" \
            "ndk;25.1.8937393"
          yes | "$LATEST/bin/sdkmanager" --sdk_root="$SDK" --licenses >/tmp/sdk-licenses-final.log || true

          # Verify the exact SDK/NDK components selected by buildozer.spec.
          test -x "$SDK/platform-tools/adb"
          test -x "$SDK/build-tools/37.0.0/aidl"
          test -d "$SDK/platforms/android-34"
          test -d "$SDK/ndk/25.1.8937393"
          "$SDK/build-tools/37.0.0/aidl" --version >/tmp/aidl-version.log 2>&1 || true
          "$SDK/ndk/25.1.8937393/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$SDK/ndk/25.1.8937393" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/25.1.8937393" >> "$GITHUB_ENV"
          echo "$LATEST/bin" >> "$GITHUB_PATH"

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf bin
          buildozer android debug 2>&1 | tee buildozer-console.log

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROLEX-AI-debug-arm64
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROLEX-AI-build-diagnostics
          path: |
            buildozer-console.log
            .buildozer/**/*.log
          if-no-files-found: ignore
