name: ROLEX AI Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.37

      - name: Compile and unit test
        run: |
          python -m compileall -q main.py tests
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .buildozer bin
          SDKROOT="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDKROOT/licenses"
          printf '%s\n' 8933bad161af4178b1185d1a37fbf41ea5269c55 d56f5187479451eabf01fb78af6dfcb131a6481e > "$SDKROOT/licenses/android-sdk-license"
          printf '%s\n' 84831b9409646a918e30573bab4c9c91346d8abd > "$SDKROOT/licenses/android-sdk-preview-license"
          export ANDROID_SDK_ROOT="$SDKROOT"
          export ANDROID_HOME="$SDKROOT"
          buildozer android debug 2>&1 | tee buildozer-console.log

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROLEX-AI-debug-arm64
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROLEX-AI-build-diagnostics
          path: |
            buildozer-console.log
            .buildozer/**/*.log
          if-no-files-found: ignore
