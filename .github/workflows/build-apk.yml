name: ROLEX AI Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget zip unzip openjdk-17-jdk libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev cmake

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.37
          python -m pip install -r requirements.txt

      - name: Compile, unit test and runtime smoke test
        shell: bash
        run: |
          set -euxo pipefail
          python -m compileall -q main.py rolex_ai tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          printf 'exit\n' | ROLEX_UI=0 python main.py
          python - <<'PY'
          from rolex_ai.app import RolexAI
          app = RolexAI()
          status = app.status()
          assert status['app'] == 'ROLEX AI'
          assert status['modules']['brain'] is True
          assert status['modules']['math'] is True
          assert status['modules']['personal_intelligence'] is True
          print('ROLEX runtime smoke test: PASS')
          PY

      - name: Bootstrap Buildozer SDK, licenses and NDK
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$HOME/.buildozer/android/platform/android-sdk" \
                 "$HOME/.buildozer/android/platform/android-ndk-r28c" \
                 "$HOME/.buildozer/android/platform/python-for-android" \
                 bin .buildozer

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          TOOLS="$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/cmdline-tools" "$SDK/tools/bin" "$SDK/licenses"

          curl -fL --retry 5 --retry-all-errors \
            -o /tmp/android-cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cmdline-tools
          mv /tmp/android-cmdline-tools/cmdline-tools "$TOOLS"

          ln -sf "$TOOLS/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
          ln -sf "$TOOLS/bin/avdmanager" "$SDK/tools/bin/avdmanager"

          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$TOOLS/bin:$SDK/tools/bin:$PATH"

          yes | "$TOOLS/bin/sdkmanager" --sdk_root="$SDK" --licenses >/tmp/sdk-licenses.log || true
          "$TOOLS/bin/sdkmanager" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358"
          yes | "$TOOLS/bin/sdkmanager" --sdk_root="$SDK" --licenses >/tmp/sdk-licenses-final.log || true

          test -x "$SDK/tools/bin/sdkmanager"
          test -x "$SDK/platform-tools/adb"
          test -x "$SDK/build-tools/37.0.0/aidl"
          test -d "$SDK/platforms/android-34"
          test -d "$SDK/ndk/28.2.13676358"

          ln -s "$SDK/ndk/28.2.13676358" "$HOME/.buildozer/android/platform/android-ndk-r28c"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$HOME/.buildozer/android/platform/android-ndk-r28c" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-ndk-r28c" >> "$GITHUB_ENV"
          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf bin
          buildozer android debug 2>&1 | tee buildozer-console.log

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROLEX-AI-debug-arm64
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROLEX-AI-build-diagnostics
          path: |
            buildozer-console.log
            .buildozer/**/*.log
            $HOME/.buildozer/android/platform/**/*.log
          if-no-files-found: ignore
