name: ROLEX AI Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.37

      - name: Compile and unit test
        run: |
          python -m compileall -q main.py tests
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Bootstrap Android SDK and accept licenses
        shell: bash
        run: |
          set -uo pipefail
          rm -rf .buildozer bin
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          set +e
          buildozer android debug 2>&1 | tee buildozer-bootstrap.log
          FIRST_STATUS=${PIPESTATUS[0]}
          set -e
          echo "Initial Buildozer status: $FIRST_STATUS"

          test -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" || {
            echo "sdkmanager was not installed by Buildozer bootstrap"
            exit "$FIRST_STATUS"
          }

          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf '%s\n' \
            8933bad161af4178b1185d1a37fbf41ea5269c55 \
            d56f5187479451eabf01fb78af6dfcb131a6481e \
            24333f8a63b6825ea9c5514f83c2829b004d1fee \
            > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf '%s\n' 84831b9409646a918e30573bab4c9c91346d8abd \
            > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"

          yes | "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          echo "Android SDK license bootstrap complete."
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          buildozer android debug 2>&1 | tee buildozer-console.log

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROLEX-AI-debug-arm64
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROLEX-AI-build-diagnostics
          path: |
            buildozer-bootstrap.log
            buildozer-console.log
            .buildozer/**/*.log
          if-no-files-found: ignore
